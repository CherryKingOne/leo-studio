[package]
name = "leo-plugin-cli"
version = "0.2.0"
edition = "2024"
description = "Leo Studio 命令行交互插件 CLI"
license = "MIT"

[[bin]]
name = "leo-cli"
path = "src/main.rs"

[dependencies]
leo-core = { path = "../../core" }
leo-plugin-importer-txt = { path = "../importers/txt" }
leo-plugin-exporter-csv = { path = "../exporters/csv" }
leo-plugin-exporter-json = { path = "../exporters/json" }
leo-plugin-cleaner-kaomoji = { path = "../text/cleaner-kaomoji" }
leo-plugin-parser-novel-regex = { path = "../text/parser-novel-regex" }
leo-plugin-dialogue-quotes = { path = "../text/dialogue-quotes" }
leo-plugin-storage-csv = { path = "../storage/csv" }
leo-plugin-tts-edge = { path = "../tts/edge" }

clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.12", features = ["v4"] }
chrono = { version = "0.4" }

[dev-dependencies]
tempfile = "3"
