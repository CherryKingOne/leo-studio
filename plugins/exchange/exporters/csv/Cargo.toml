[package]
name = "leo-plugin-exporter-csv"
version = "0.1.0"
edition = "2024"
description = "Leo Studio 官方插件：将剧本台词与旁白导出为标准配音生产 CSV 台账"
license = "MIT"

[dependencies]
leo-core = { path = "../../../../core" }
csv = "1.4"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tracing = "0.1"
