[package]
name = "leo-plugin-cleaner-kaomoji"
version = "0.1.0"
edition = "2024"
description = "Leo Studio 官方插件：网络小说颜文字与机械文本清洗引擎"
license = "MIT"

[dependencies]
leo-core = { path = "../../../core" }
fancy-regex = "0.14"
unicode_categories = "0.1"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
tracing = "0.1"
