[package]
name = "leo-plugin-tts-stepfun"
version = "0.1.0"
edition = "2024"
description = "Leo Studio 语音合成子插件：阶跃星辰（StepFun）TTS，注册为 TTS 驱动 stepfun"
license = "MIT"

[dependencies]
leo-core = { path = "../../../core" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
# 不让 reqwest 再带一份 ring：msedge-tts 已经启用了 rustls 的 aws-lc-rs，
# 两个加密后端同时存在时 rustls 会在运行时 panic。这里显式依赖 rustls 默认特性（aws-lc-rs）。
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
