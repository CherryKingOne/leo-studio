[package]
name = "leo-plugin-api"
version = "0.2.0"
edition = "2024"

[dependencies]
leo-core = { path = "../../../core" }

tokio = { version = "1.43", features = ["sync", "rt", "macros", "net", "io-util", "fs"] }
axum = { version = "0.8", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1.12", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
mime_guess = "2.0"
regex = "1.11"
fancy-regex = "0.14"
unicode_categories = "0.1"
csv = "1"
bytes = "1"
percent-encoding = "2"
http-body-util = "0.1"
dotenvy = "0.15"
