[package]
name = "leo-plugin-llm"
version = "0.1.0"
edition = "2024"
description = "Leo Studio 注册层插件（llm）：管理大模型对话驱动子插件，按配置挑选默认驱动并对外提供统一服务"
license = "MIT"

[dependencies]
leo-core = { path = "../../../core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
