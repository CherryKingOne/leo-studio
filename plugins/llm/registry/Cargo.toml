[package]
name = "leo-plugin-llm"
version = "0.1.0"
edition = "2024"
description = "Leo Studio 注册层插件（llm）：管理全部 LLM 供应商驱动，按配置挑选默认驱动，按“驱动id:模型”路由，并提供协议桥"
license = "MIT"

[dependencies]
leo-core = { path = "../../../core" }
leo-llm-protocol = { path = "../protocol" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
