[package]
name = "leo-plugin-llm-bailian"
version = "0.1.0"
edition = "2024"
description = "Leo Studio 大语言模型子插件：阿里云百炼（Qwen），注册为 LLM 驱动 bailian，支持 OpenAI Chat / OpenAI Responses / Anthropic 三种协议"
license = "MIT"

[dependencies]
leo-core = { path = "../../../core" }
leo-llm-protocol = { path = "../protocol" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
