[package]
name = "leo-studio-backend"
version = "0.2.0"
edition = "2024"
description = "Leo Studio 后端微内核引导启动程序"
license = "MIT"

[[bin]]
name = "leo-studio-backend"
path = "src/main.rs"

[dependencies]
leo-core = { path = "../core" }
leo-plugin-importer-txt = { path = "../plugins/importers/txt" }
leo-plugin-exporter-csv = { path = "../plugins/exporters/csv" }
leo-plugin-exporter-json = { path = "../plugins/exporters/json" }
leo-plugin-cleaner-kaomoji = { path = "../plugins/text/cleaner-kaomoji" }
leo-plugin-parser-novel-regex = { path = "../plugins/text/parser-novel-regex" }
leo-plugin-dialogue-quotes = { path = "../plugins/text/dialogue-quotes" }
leo-plugin-storage-csv = { path = "../plugins/storage/csv" }
leo-plugin-tts-edge = { path = "../plugins/tts/edge" }
leo-plugin-api = { path = "../plugins/api" }
leo-plugin-mcp = { path = "../plugins/mcp" }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
axum = { version = "0.8" }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
csv = "1"
