[package]
name = "leo-app"
version = "0.2.0"
edition = "2024"
description = "Leo Studio 微内核主机启动程序 Host App"
license = "MIT"

[[bin]]
name = "leo-app"
path = "src/main.rs"

[dependencies]
leo-core = { path = "../core" }
leo-plugin-catalog = { path = "../plugins/catalog" }
leo-plugin-api = { path = "../plugins/interfaces/api" }
leo-plugin-mcp = { path = "../plugins/interfaces/mcp" }

tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
axum = { version = "0.8" }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
serde_json = "1"
csv = "1"
