[package]
name = "leo-core"
version = "0.1.0"
edition = "2024"
description = "Leo Studio 微内核：通用剧本 AST、Cordis 式服务上下文、生产管线与插件 SPI"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
leo-plugin-cleaner-kaomoji = { path = "../plugins/cleaner-kaomoji" }
leo-plugin-parser-novel-regex = { path = "../plugins/parser-novel-regex" }
leo-plugin-dialogue-quotes = { path = "../plugins/dialogue-quotes" }
leo-plugin-tts-edge = { path = "../plugins/tts-edge" }
